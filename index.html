
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<title>LYRON AI — Zəkanın yeni səviyyəsi</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #090909;
  color: #f5f0e5;
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

header {
  height: 70px;
  padding: 0 22px;
  border-bottom: 1px solid #292319;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  color: #d6ad55;
  font-size: 23px;
  font-weight: bold;
  letter-spacing: 2px;
}

.logo span {
  color: white;
}

.status {
  color: #b99a5b;
  font-size: 11px;
}

main {
  max-width: 780px;
  margin: 45px auto;
  padding: 16px;
}

.hero {
  text-align: center;
  margin-bottom: 30px;
}

.emblem {
  color: #d6ad55;
  font-size: 38px;
  margin-bottom: 10px;
}

h1 {
  font-size: 31px;
  letter-spacing: 2px;
  margin-bottom: 8px;
}

h1 span {
  color: #d6ad55;
}

.subtitle {
  color: #888;
  font-size: 13px;
}

.chat {
  border: 1px solid #40351f;
  border-radius: 14px;
  background: #101010;
  overflow: hidden;
}

.chat-top {
  padding: 15px 18px;
  border-bottom: 1px solid #292319;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.chat-title {
  font-size: 13px;
  color: #d6ad55;
}

.clear-button {
  background: transparent;
  border: 1px solid #514329;
  color: #aaa;
  padding: 8px 11px;
  border-radius: 7px;
  font-size: 11px;
  cursor: pointer;
}

.clear-button:hover {
  color: #d6ad55;
  border-color: #d6ad55;
}

.messages {
  height: 390px;
  overflow-y: auto;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.message {
  max-width: 88%;
  padding: 12px 14px;
  border-radius: 10px;
  font-size: 14px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.bot {
  align-self: flex-start;
  background: #1b1b1b;
  border-left: 2px solid #d6ad55;
}

.user {
  align-self: flex-end;
  background: #292319;
  border-right: 2px solid #d6ad55;
}

.input-area {
  padding: 14px;
  border-top: 1px solid #292319;
  display: flex;
  gap: 10px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border: 1px solid #40351f;
  border-radius: 9px;
  background: #080808;
  color: white;
  outline: none;
  font-size: 14px;
}

input:focus {
  border-color: #d6ad55;
}

.send-button {
  padding: 0 20px;
  background: #c49b48;
  color: #080808;
  border: none;
  border-radius: 9px;
  font-weight: bold;
  cursor: pointer;
}

.send-button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.send-button:hover:not(:disabled) {
  background: #e0bd70;
}

footer {
  text-align: center;
  color: #666;
  margin-top: 25px;
  font-size: 11px;
}

@media(max-width: 500px) {
  main {
    margin-top: 25px;
  }

  h1 {
    font-size: 27px;
  }

  .messages {
    height: 55vh;
    min-height: 280px;
  }

  .input-area {
    padding: 10px;
  }

  .send-button {
    padding: 0 15px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">✦ LYRON <span>AI</span></div>
  <div class="status">● Sistem aktivdir</div>
</header>

<main>

  <section class="hero">
    <div class="emblem">✧</div>
    <h1>LYRON <span>AI</span></h1>
    <p class="subtitle">Zəkanın yeni səviyyəsi.</p>
  </section>

  <section class="chat">

    <div class="chat-top">
      <div class="chat-title">LYRON AI · Söhbət</div>
      <button class="clear-button" id="clearButton">
        Yaddaşı təmizlə
      </button>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <input
        id="userInput"
        type="text"
        placeholder="Mesajınızı yazın..."
        autocomplete="off"
      >
      <button class="send-button" id="sendButton">
        Göndər
      </button>
    </div>

  </section>

  <footer>
    LYRON AI © 2026 — Zəkanın yeni səviyyəsi.
  </footer>

</main>

<script>
const STORAGE_KEY = "lyronHistory";

let chatHistory = [];
let isSending = false;

const messages = document.getElementById("messages");
const input = document.getElementById("userInput");
const sendButton = document.getElementById("sendButton");
const clearButton = document.getElementById("clearButton");

function saveHistory() {
  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(chatHistory)
    );
  } catch (error) {
    console.error("Yaddaş xətası:", error);
  }
}

function renderMessage(role, content) {
  const msg = document.createElement("div");

  msg.className =
    role === "user" ? "message user" : "message bot";

  msg.textContent =
    (role === "user" ? "Siz: " : "LYRON AI: ") + content;

  messages.appendChild(msg);
}

function loadHistory() {
  try {
    const saved = JSON.parse(
      localStorage.getItem(STORAGE_KEY) || "[]"
    );

    if (!Array.isArray(saved)) {
      chatHistory = [];
    } else {
      chatHistory = saved.filter(item =>
        item &&
        ["user", "assistant"].includes(item.role) &&
        typeof item.content === "string"
      ).slice(-100);
    }
  } catch (error) {
    chatHistory = [];
  }

  messages.innerHTML = "";

  if (chatHistory.length === 0) {
    renderMessage(
      "assistant",
      "Salam! Mən LYRON AI. Sizə kömək etməyə hazıram. Nə barədə danışaq?"
    );
  } else {
    chatHistory.forEach(item => {
      renderMessage(item.role, item.content);
    });
  }

  messages.scrollTop = messages.scrollHeight;
}

async function sendMessage() {
  if (isSending) return;

  const text = input.value.trim();

  if (!text) return;

  isSending = true;
  sendButton.disabled = true;

  chatHistory.push({
    role: "user",
    content: text
  });

  renderMessage("user", text);

  input.value = "";

  saveHistory();

  const loading = document.createElement("div");
  loading.className = "message bot";
  loading.textContent = "LYRON AI düşünür...";

  messages.appendChild(loading);
  messages.scrollTop = messages.scrollHeight;

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text,
        history: chatHistory.slice(0, -1)
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "AI bağlantı xətası"
      );
    }

    if (typeof data.answer !== "string") {
      throw new Error("AI cavabı düzgün deyil.");
    }

    loading.textContent = "LYRON AI: " + data.answer;

    chatHistory.push({
      role: "assistant",
      content: data.answer
    });

    chatHistory = chatHistory.slice(-100);
    saveHistory();

  } catch (error) {
    loading.textContent =
      "LYRON AI: " + error.message;
  } finally {
    isSending = false;
    sendButton.disabled = false;
    messages.scrollTop = messages.scrollHeight;
    input.focus();
  }
}

function clearHistory() {
  const confirmed = confirm(
    "Bütün söhbət tarixçəsini silmək istəyirsiniz?"
  );

  if (!confirmed) return;

  chatHistory = [];

  localStorage.removeItem(STORAGE_KEY);

  loadHistory();
}

sendButton.addEventListener("click", sendMessage);

input.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    sendMessage();
  }
});

clearButton.addEventListener("click", clearHistory);

loadHistory();
</script>

</body>
</html>
